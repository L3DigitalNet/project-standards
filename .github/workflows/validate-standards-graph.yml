name: Validate standards graph

on:
  pull_request:
  push:
    branches: ["main", "testing"]

permissions:
  contents: read

jobs:
  standards-graph:
    name: Standards graph and catalog
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.6"
          enable-cache: true
          # v9 flipped the default to false; keep the prior always-prune behavior.
          prune-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-groups

      - name: Validate package contracts
        run: uv run project-standards standards validate-packages --root .

      - name: Validate standards graph
        run: uv run project-standards standards validate-graph --root . --require-all-manifests

      - name: Check generated package schemas
        run: uv run project-standards standards generate-package-schemas --root . --check

      - name: Check payload projection
        run: uv run project-standards standards sync-payload-projection --root . --check

      - name: Check standards catalog freshness
        run: uv run project-standards standards render-catalog --root . --check

      - name: Resolve released V2 baseline
        id: v2-baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(
            git for-each-ref --sort=-version:refname --format='%(refname:short)' 'refs/tags/v[0-9]*' |
              while IFS= read -r tag; do
                if git ls-tree -r --name-only "$tag" -- catalogs |
                  grep -Eq '^catalogs/[1-9][0-9]*\.toml$'; then
                  printf '%s\n' "$tag"
                  break
                fi
              done
          )"
          if [[ -n "$baseline" ]] && git diff --quiet "$baseline" -- catalogs standards; then
            echo 'Released V2 package surface is unchanged.'
            baseline=""
          fi
          if [[ -n "$baseline" ]]; then
            printf 'ref=%s\n' "$baseline" >> "$GITHUB_OUTPUT"
          else
            echo 'No released V2 catalog baseline exists.'
            printf 'ref=\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Check released V2 payloads
        if: steps.v2-baseline.outputs.ref != ''
        env:
          BASELINE_REF: ${{ steps.v2-baseline.outputs.ref }}
        run: uv run project-standards packages check-release --root . --baseline "$BASELINE_REF"
