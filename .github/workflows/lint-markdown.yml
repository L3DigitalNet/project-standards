name: Lint Markdown

# Stack B (the Markdown *body* linter) — distinct from validate-markdown-frontmatter.yml,
# which gates the YAML *frontmatter*. Kept as a separate, opt-in reusable workflow so
# frontmatter-only consumers never inherit a Node/markdownlint toolchain (DEC-8). The
# action ships its own Node runtime and auto-discovers the repo's `.markdownlint.json`,
# so neither this repo nor a consumer needs a committed Node project (DEC-3 / DEC-7).
on:
  push:
    branches: ["main"]
    paths:
      - "**/*.md"
      - ".markdownlint.json"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/lint-markdown.yml"
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint.json"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/lint-markdown.yml"

  # Reusable: opt-in Markdown body linting for a consuming repo. It lints the
  # CALLER's Markdown against the CALLER's `.markdownlint.json` (seed yours from
  # this repo's published config) — nothing is installed from this repo. Pass
  # multiple globs newline-delimited via a YAML block scalar.
  #
  #   jobs:
  #     lint-markdown:
  #       uses: L3DigitalNet/project-standards/.github/workflows/lint-markdown.yml@v5
  #       with:
  #         globs: '**/*.md'
  workflow_call:
    inputs:
      markdownlint:
        description: "Run the Markdown lint check."
        required: false
        type: boolean
        default: true
      globs:
        description: "Newline-delimited glob(s) of Markdown files to lint."
        required: false
        type: string
        default: "**/*.md"
      config:
        description: "Path to a base markdownlint config file. Empty = auto-discover the caller's .markdownlint.json."
        required: false
        type: string
        default: ""
      runner-labels:
        description: "JSON array of runner labels; empty selects the GitHub-hosted runner. Private same-organization callers only."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  lint:
    name: Markdown
    # Direct events have no reusable-workflow input and therefore keep the
    # default run behavior; an explicit typed false skips setup and linting.
    if: ${{ format('{0}', inputs.markdownlint) != 'false' }}
    # Allocated from the CALLER's context, so a private caller's self-hosted
    # labels select its own organization's runners and nothing is attached to
    # this public repository. Direct events leave `inputs` empty and fall
    # through to the hosted runner, which public repos require.
    runs-on: ${{ inputs.runner-labels && fromJSON(inputs.runner-labels) || 'ubuntu-latest' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The action's own `globs` default is the non-recursive `*.{md,markdown}`,
      # so it is passed explicitly. On this repo's push/PR runs `inputs.globs` is
      # empty and the `||` fallback supplies the recursive default.
      #
      # Issue #63: markdownlint-cli2 traverses dot directories and `node_modules`,
      # so the recursive default alone pulls in `.venv/**` and `.pytest_cache/**`
      # Markdown that Prettier never sees (the format workflow reaches Prettier
      # through `--ignore-path .gitignore`). markdownlint-cli2 0.23.1 exposes its
      # `gitignore` switch only through a `.markdownlint-cli2.*` runner config,
      # which this package does not ship, so parity is restored with trailing
      # negative globs. They must trail the positive globs: markdownlint-cli2
      # resolves the list in order, and a leading negation would be undone by the
      # positive pattern that follows. A repository that must lint one of these
      # trees owns this workflow (`lint_workflow_ownership = "consumer-owned"`).
      - name: Lint Markdown (markdownlint-cli2)
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24
        with:
          globs: |
            ${{ inputs.globs || '**/*.md' }}
            !.pytest_cache/**
            !.ruff_cache/**
            !.venv/**
            !node_modules/**
          config: ${{ inputs.config }}
