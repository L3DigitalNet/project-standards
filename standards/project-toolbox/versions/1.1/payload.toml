# `openai.yaml` is a Codex-only descriptor (Claude Code has no analogous sidecar
# convention), so it installs solely under Codex's `.agents/skills/` tree and only
# when the consumer actually selected Codex. Unlike SKILL.md below, it has no
# `.claude/skills/` counterpart to keep in sync. See #175.
[[artifacts]]
id = "skill-openai"
target = ".agents/skills/project-toolbox/agents/openai.yaml"
source = "skills/project-toolbox/agents/openai.yaml"
digest = "sha256:3b2d361850da3d6ffbf99fcbd725456a04a040f3e4caf9026fe6c2ffe31170d8"
policy = "managed"
when_any = [{ option = "harnesses", contains = "codex" }]

# Claude Code discovers project skills only under `.claude/skills/`; it has never
# read `.agents/skills/`, which is Codex's convention. SKILL.md is therefore
# installed twice from one source, so both harnesses see the same bytes. The pair
# must stay byte-identical: same `source` and `digest`, differing only in `id` and
# `target`. Copies, not symlinks — a symlink checks out as a plain text file on a
# Windows clone without Developer Mode, which would silently install the link path
# as the skill body. Divergence is already guarded because both targets are
# digest-locked managed artifacts. See ADR 0021 and issue #170.
[[artifacts]]
id = "skill-claude"
target = ".claude/skills/project-toolbox/SKILL.md"
source = "skills/project-toolbox/SKILL.md"
digest = "sha256:3668b977b1778851e79c485d7ed237bb03cf201307a381d27460e3aa022425fb"
policy = "managed"

# ADR 0006 requires supplying no provider implementation to be explicit rather than
# a silent no-op: 1.1 still ships guidance documents only, so it declares no
# `[[providers]]`, `[[contributions]]`, `[[extensions]]`, `[[migrations]]`,
# `[[legacy_states]]`, or `[[legacy_signatures]]`. `[[migrations]]` tracks a
# legacy pre-catalog state, not a package-version bump — this family has never
# had one, so 1.1 still declares none even though it now has an in-repo
# predecessor. A mechanical drift-detection verify provider is a recorded
# deferral, not an omission.
