# Claude Code discovers project skills only under `.claude/skills/`; it has never
# read `.agents/skills/`, which is Codex's convention. Each skill file is therefore
# installed twice from one source, so both harnesses see the same bytes. The pair
# must stay byte-identical: same `source` and `digest`, differing only in `id` and
# `target`. Copies, not symlinks — a symlink checks out as a plain text file on a
# Windows clone without Developer Mode, which would silently install the link path
# as the skill body. Divergence is already guarded because both targets are
# digest-locked managed artifacts. See ADR 0021 and issue #170.
[[artifacts]]
id = "skill-claude"
target = ".claude/skills/project-toolbox/SKILL.md"
source = "skills/project-toolbox/SKILL.md"
digest = "sha256:3668b977b1778851e79c485d7ed237bb03cf201307a381d27460e3aa022425fb"
policy = "managed"

[[artifacts]]
id = "skill-openai-claude"
target = ".claude/skills/project-toolbox/agents/openai.yaml"
source = "skills/project-toolbox/agents/openai.yaml"
digest = "sha256:3b2d361850da3d6ffbf99fcbd725456a04a040f3e4caf9026fe6c2ffe31170d8"
policy = "managed"

# ADR 0006 requires supplying no provider implementation to be explicit rather than
# a silent no-op: 1.0 ships guidance documents, so it declares no `[[providers]]`,
# `[[contributions]]`, `[[extensions]]`, `[[migrations]]`, `[[legacy_states]]`, or
# `[[legacy_signatures]]`. A new family has no predecessor to migrate from, and a
# mechanical drift-detection verify provider is a recorded deferral, not an omission.
