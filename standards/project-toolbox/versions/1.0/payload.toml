[config]
schema_resource = "config-schema"

[capabilities]
provides = ["project-toolbox.workflows"]
consumes_platform = ["project-standards.reconcile"]

# The family is deliberately dependency-free: ADR 0023 forbids requiring another
# standard for a platform need, and the design brief's soft-dependency posture is
# implemented instructionally instead — each workflow document reads
# `.standards/config.toml` and folds whatever is installed into its sweep. Declaring
# companions here would turn that composition into a resolution constraint.
[relations]
companions = []
extends = []
conflicts = []

