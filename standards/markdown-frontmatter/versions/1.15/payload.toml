when_any = [{ option = "workflow_ownership", equals = "managed" }]

# Ambient reach (1.14): before this version the package contributed only to the CI
# caller, so a consumer repository gave agents no standing statement that managed
# Markdown carries frontmatter at all — the skill was in context for roughly 5% of
# the sessions that wrote frontmatter. These two blocks are the same instruction
# surface `agent-handoff`, `markdown-tooling`, `github-workflow`, and
# `python-tooling` already occupy, one block per harness because each harness reads
# only its own instruction file and only its own skill tree.
#
# Static `source` rather than a render provider: the block text is fixed, so no
# option can change it, and a provider would exist only to return a constant. The
# source file is the whole Prettier/marker envelope, not the bare body — the
# planner re-parses contribution content as a Markdown document and extracts the
# named block from it (see `_normalize_desired`), so a body-only fragment would
# resolve to no unit at all. Keep both files' envelopes and block IDs identical to
# `scope` here; they differ only in the skill path they name.
[[contributions]]
id = "agents-instructions"
target = "AGENTS.md"
adapter = "markdown-block"
scope = "block:markdown-frontmatter"
policy = "managed"
source = "agents-instructions.md"
source_digest = "sha256:28be5f6bc3587b43537ffc7dea93b120100a8f48835391b2b4dc1f2d06ddcb76"
governing_options = []
when_any = [{ option = "harnesses", contains = "codex" }]

[[contributions]]
id = "claude-instructions"
target = "CLAUDE.md"
adapter = "markdown-block"
scope = "block:markdown-frontmatter"
policy = "managed"
source = "claude-instructions.md"
source_digest = "sha256:7053e17f6056856215a0b55538858e271839740aba5dcab3d793c6ee1b5b48c1"
governing_options = []
when_any = [{ option = "harnesses", contains = "claude-code" }]

