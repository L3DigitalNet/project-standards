[[legacy_states]]
id = "v4-markdown-frontmatter"

# 1.14 adds the two agent-instruction blocks and rewrites skill prose; every
# pre-existing target keeps its predecessor rendering, and the new blocks are
# additions to files the consumer already owns rather than moves, so there is no
# package-to-package migration edge to declare — an upgrading consumer gains
# managed units and loses none. Issue #170 established the same reasoning when the
# predecessor added the `.claude/skills/` twin. 1.15 declares no edge either
# (issue #201): it advances only the `setup-uv` pin inside the self-hosted
# workflow resource, so the whole-file target keeps its identity and managed
# policy and ordinary reconciliation rewrites the drifted bytes.
[[migrations]]
id = "legacy-v4-to-1-12"
from = "legacy:v4-markdown-frontmatter"
to = "package:1.15"
mode = "automatic"
provider = "migrate-legacy"
reversible = false
affected = [
  "artifact:skill",
  "artifact:skill-claude",
  "artifact:skill-new-doc-id",
  "artifact:skill-new-doc-id-claude",
  "artifact:skill-openai",
  "artifact:self-host-workflow",
  "config:*",
  "contribution:agents-instructions",
  "contribution:claude-instructions",
  "contribution:workflow-frontmatter-job",
  "contribution:workflow-permissions",
]
signatures = [
  "legacy-skill",
  "legacy-skill-script",
  "legacy-validate-standards-workflow",
  "legacy-workflow",
]

