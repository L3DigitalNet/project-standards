# `openai.yaml` is a Codex-only descriptor (Claude Code has no analogous sidecar
# convention), so it installs solely under Codex's `.agents/skills/` tree and only
# when the consumer actually selected Codex. Unlike SKILL.md and new-doc-id below,
# it has no `.claude/skills/` counterpart to keep in sync. See #175.
[[artifacts]]
id = "skill-openai"
target = ".agents/skills/markdown-frontmatter/agents/openai.yaml"
source = "skills/markdown-frontmatter/agents/openai.yaml"
digest = "sha256:d63c2c63683e78fa9adb10e7004fe9315b18a069240c4457e39cdc167951716c"
policy = "managed"
when_any = [{ option = "harnesses", contains = "codex" }]

[[artifacts]]
id = "skill-new-doc-id"
target = ".agents/skills/markdown-frontmatter/scripts/new-doc-id"
source = "skills/markdown-frontmatter/scripts/new-doc-id"
digest = "sha256:abec9fc9e78390949320dc0b0a9e63d2d6a9959990068782ec6d60596fcf14b5"
policy = "managed"
mode = "0755"

# Claude Code discovers project skills only under `.claude/skills/`; it has never
# read `.agents/skills/`, which is Codex's convention. SKILL.md and new-doc-id are
# therefore installed twice from one source, so both harnesses see the same bytes.
# Each pair must stay byte-identical: same `source`, `digest`, and `mode`,
# differing only in `id` and `target`. Copies, not symlinks — a symlink checks out
# as a plain text file on a Windows clone without Developer Mode, which would
# silently install the link path as the file body. Divergence is already guarded
# because both targets are digest-locked managed artifacts. See issue #170.
[[artifacts]]
id = "skill-claude"
target = ".claude/skills/markdown-frontmatter/SKILL.md"
source = "skills/markdown-frontmatter/SKILL.md"
digest = "sha256:585f2a1337da626be904f375677b9fb9997acea2827702471dc3741e1c77bd43"
policy = "managed"

