id = "skill-new-doc-id-claude"
target = ".claude/skills/markdown-frontmatter/scripts/new-doc-id"
source = "skills/markdown-frontmatter/scripts/new-doc-id"
digest = "sha256:abec9fc9e78390949320dc0b0a9e63d2d6a9959990068782ec6d60596fcf14b5"
policy = "managed"
mode = "0755"

