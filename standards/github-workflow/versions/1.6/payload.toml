# Claude Code discovers project skills only under `.claude/skills/`; it has never
# read `.agents/skills/`, which is Codex's convention. Every skill file below is
# therefore installed twice from one source, so both harnesses see the same bytes.
# Each pair must stay byte-identical: same `source`, `digest`, `mode`, and
# `when_any`, differing only in `id` and `target`. Copies, not symlinks — a symlink
# checks out as a plain text file on a Windows clone without Developer Mode, which
# would silently install the link path as the file body. Divergence is already
# guarded because both targets are digest-locked managed artifacts. See issue #170.
#
# One deliberate exception: `agents/openai.yaml` is declared under `.agents/` only.
# It is Codex's own skill-companion format and Claude Code has never read it, so the
# `.claude/` copy was bytes no harness could use (issue #175). Every other skill file
# still lands in both trees.
[[artifacts]]
id = "skill-claude"
target = ".claude/skills/github-workflow/SKILL.md"
source = "skills/github-workflow/SKILL.md"
digest = "sha256:f8a9dfa539e7f85eb26f1b267ea81e798bb43dfd96e5d614cd03b7bad032607d"
policy = "managed"

[[artifacts]]
id = "tool-binary-claude"
target = ".claude/skills/github-workflow/bin/gh-workflow"
source = "skills/github-workflow/bin/gh-workflow"
digest = "sha256:e75ba2242d838076b1103d4697f83b46244a8197f7b68d4b214523ac09eaf829"
