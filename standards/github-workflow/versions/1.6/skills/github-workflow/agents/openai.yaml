interface:
  display_name: "GitHub Workflow"
  short_description: "Apply the packaged GitHub work discipline before touching work state."
  default_prompt: "Use $github-workflow before creating or mutating GitHub work state — issues, issue field values, pull requests, lifecycle transitions, milestones — before triage or an organization-schema audit, and before presenting an operator-requested issue or PR summary. SKILL.md is one read of about 69 lines and its routing table is the complete flag surface, so read it whole and do not spend calls on gh-workflow help. Route every action through the row that names it; keep type, value, and content judgment with the agent; honor the skill's refusals."

policy:
  allow_implicit_invocation: true
