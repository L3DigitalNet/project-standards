[[migrations]]
# Issue #99: the whole 1.11->1.17 span is Ruff ownership granularity. This edge
# is load-bearing rather than bookkeeping: the consumer's lock still holds the
# predecessor's `table:/tool/ruff`, which overlaps every unit declared here, and
# the planner refuses an undeclared overlap with CP-LOCK-INCONSISTENT. The
# declared edge is what authorizes the locked table to retire into leaf units.
#
# Issues #116, #153, #180, and #181 declare no 1.12->1.17, 1.13->1.17, or
# 1.14->1.17 edge on purpose. Each of those cuts adds default-compatible options;
# the default unit identities and bytes remain unchanged, so no predecessor holds
# lock state to migrate. A consumer that opts into `runner_labels` or
# `ruff.enforce_line_length` later is covered by ordinary reconciliation, which
# re-renders exactly the one unit each option governs.
#
# Issue #182 declares no 1.15->1.16 edge either, and issue #201 declares no
# 1.16->1.17 edge. These two are the cases where rendered bytes do change:
# `uv_build` adopters got a new `requires` bound in the `build-system` unit at
# 1.16, and 1.17 advances the `setup-uv` pin inside the rendered `check.yml`.
# Both leave the unit identity (`table:/build-system`, and the whole-file
# workflow target) and its managed policy unchanged, so the lock needs no
# retargeting - ordinary reconciliation reports the unit as drifted and rewrites
# it. An edge here would claim lock state has to move, which would be false.
id = "python-tooling-1-11-to-1-17"
from = "package:1.11"
to = "package:1.17"
mode = "automatic"
provider = "migrate-config"
reversible = false
affected = [
  "config:*",
  "contribution:ruff-extend-exclude",
  "contribution:ruff-extend-include",
  "contribution:ruff-format",
  "contribution:ruff-line-length",
  "contribution:ruff-lint-extend-ignore",
  "contribution:ruff-lint-extend-select",
  "contribution:ruff-lint-ignore",
  "contribution:ruff-lint-select",
  "contribution:ruff-per-file-ignores",
  "contribution:ruff-src",
  "contribution:ruff-target-version",
]
signatures = []
configuration_transform = ["/ci/performance"]

