[[contributions]]
id = "python-version"
target = ".python-version"
adapter = "whole-file"
scope = "$file"
policy = "managed"
provider = "render-semantic"

# Issue #180: `runner_labels` templates this file's `runs-on` directly. It is the
# only unit the option reaches, and it is inert while `workflow_ownership` is
# `consumer-owned`, because then nothing here materializes at all.
[[contributions]]
id = "check-workflow"
governing_options = ["runner_labels"]
target = ".github/workflows/check.yml"
adapter = "whole-file"
scope = "$file"
policy = "managed"
provider = "render-semantic"

[[contributions.when_any]]
option = "workflow_ownership"
equals = "managed"

[[contributions]]
id = "check-script"
target = "scripts/check.py"
adapter = "whole-file"
scope = "$file"
policy = "managed"
provider = "render-semantic"

[[contributions.when_any]]
option = "script_ownership"
equals = "managed"

[[contributions]]
id = "build-system"
governing_options = ["build_backend"]
target = "pyproject.toml"
adapter = "toml"
scope = "table:/build-system"
policy = "managed"
provider = "render-semantic"
when_any = [
  { option = "build_backend", equals = "uv_build" },
  { option = "build_backend", equals = "hatchling" },
  { option = "build_backend", equals = "setuptools" },
]

[[contributions]]
id = "dev-dependencies"
governing_options = ["/type_checker/name", "/coverage/patch", "additional_dev_dependencies"]
target = "pyproject.toml"
adapter = "toml"
scope = "key:/dependency-groups/dev"
policy = "managed"
provider = "render-semantic"

# Issue #99: Ruff ownership is leaf-addressable from 1.12 on. The predecessor's
# single `table:/tool/ruff` unit swallowed every `[tool.ruff.lint.*]` plugin
# sub-table a consumer wrote, and no option could express one, so adoption
# blocked on configuration the package neither renders nor understands. These
# units name exactly what the package renders; anything else under `[tool.ruff]`
# is consumer-owned, the same contract BasedPyright and pytest carry.
[[contributions]]
id = "ruff-target-version"
governing_options = ["python_version"]
target = "pyproject.toml"
adapter = "toml"
scope = "key:/tool/ruff/target-version"
policy = "managed"
provider = "render-semantic"

[[contributions]]
id = "ruff-line-length"
governing_options = ["/ruff/line_length"]
target = "pyproject.toml"
adapter = "toml"
scope = "key:/tool/ruff/line-length"
policy = "managed"
provider = "render-semantic"

[[contributions]]
id = "ruff-src"
governing_options = ["source_layout", "additional_source_roots", "/pytest/test_paths"]
target = "pyproject.toml"
adapter = "toml"
scope = "key:/tool/ruff/src"
policy = "managed"
provider = "render-semantic"

[[contributions]]
id = "ruff-extend-exclude"
governing_options = ["/ruff/extend_exclude"]
target = "pyproject.toml"
adapter = "toml"
scope = "key:/tool/ruff/extend-exclude"
policy = "managed"
provider = "render-semantic"

[[contributions]]
id = "ruff-extend-include"
governing_options = ["/ruff/extend_include"]
target = "pyproject.toml"
adapter = "toml"
scope = "key:/tool/ruff/extend-include"
policy = "managed"
provider = "render-semantic"

[[contributions]]
id = "ruff-lint-select"
governing_options = []
target = "pyproject.toml"
adapter = "toml"
scope = "key:/tool/ruff/lint/select"
policy = "managed"
provider = "render-semantic"

# Issue #181: `lint.ignore` is no longer a fixed literal, so the unit declares the
# option that decides it. Without this, a CP-MODIFIED-MANAGED report on the key
# would name no option and the consumer would have no documented lever to reach.
[[contributions]]
id = "ruff-lint-ignore"
governing_options = ["/ruff/enforce_line_length"]
target = "pyproject.toml"
adapter = "toml"
scope = "key:/tool/ruff/lint/ignore"
policy = "managed"
provider = "render-semantic"

[[contributions]]
id = "ruff-lint-extend-select"
governing_options = ["/ruff/extend_select"]
target = "pyproject.toml"
adapter = "toml"
scope = "key:/tool/ruff/lint/extend-select"
policy = "managed"
provider = "render-semantic"

[[contributions]]
id = "ruff-lint-extend-ignore"
governing_options = ["/ruff/extend_ignore"]
target = "pyproject.toml"
adapter = "toml"
scope = "key:/tool/ruff/lint/extend-ignore"
policy = "managed"
provider = "render-semantic"

# Issue #116: the table stays one unit and gains a governing option. The consumer's
# `extend_per_file_ignores` entries compose into the value rendered here, so Ruff's
# separate `extend-per-file-ignores` table remains consumer-owned exactly as the
# 1.12 ownership rule above promises, and a repository that already writes that
# table by hand keeps it through this cut.
[[contributions]]
id = "ruff-per-file-ignores"
governing_options = ["/ruff/extend_per_file_ignores"]
target = "pyproject.toml"
adapter = "toml"
scope = "table:/tool/ruff/lint/per-file-ignores"
policy = "managed"
provider = "render-semantic"

[[contributions]]
id = "ruff-format"
governing_options = []
target = "pyproject.toml"
adapter = "toml"
scope = "table:/tool/ruff/format"
policy = "managed"
provider = "render-semantic"

# Issue #89: import resolution is a separate contract from file selection. The
# layout root must answer before an editable installation of the consumer's own
# distribution, which strict mode otherwise reports as untyped.
[[contributions]]
