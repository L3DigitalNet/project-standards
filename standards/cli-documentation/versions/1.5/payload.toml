[[contributions]]
id = "usage-document"
target = "docs/usage.md"
adapter = "whole-file"
scope = "$file"
policy = "create-only"
provider = "render-usage"
governing_options = ["usage_index_path"]
when_any = [{ option = "usage_ownership", equals = "managed" }]

[[extensions]]
id = "workflow"
option = "workflow_path"
media_type = "text/yaml"
path_policy = "repository-relative"

[[extensions]]
id = "usage-index"
option = "usage_index_path"
media_type = "text/markdown"
path_policy = "repository-relative"

[[providers]]
id = "render-usage"
operation = "render"
kind = "python"
phase = "plan"
effect = "content"
entrypoint = "payload:provider-code#run_render_usage"
input_schema = "provider-input"
output_schema = "provider-content"
resources = ["usage-template"]

[[providers]]
id = "render-workflow"
operation = "render"
kind = "python"
phase = "plan"
effect = "content"
entrypoint = "payload:provider-code#run_render"
input_schema = "provider-input"
output_schema = "provider-content"
resources = []

[[providers]]
id = "verify-workflow"
operation = "verify"
kind = "python"
phase = "verify"
effect = "findings"
entrypoint = "payload:provider-code#run_verify"
input_schema = "provider-input"
output_schema = "provider-findings"
resources = ["legacy-workflow"]

[[providers]]
id = "migrate-legacy"
operation = "migrate"
kind = "python"
phase = "plan"
effect = "migration-report"
entrypoint = "payload:provider-code#run_migrate"
input_schema = "provider-input"
output_schema = "provider-migration-report"
resources = []

[[legacy_states]]
id = "v4-cli-documentation"

[[migrations]]
id = "legacy-v4-to-1-5"
from = "legacy:v4-cli-documentation"
to = "package:1.5"
mode = "automatic"
provider = "migrate-legacy"
reversible = false
affected = ["contribution:usage-document", "config:*"]
signatures = ["legacy-usage", "legacy-workflow"]

[[legacy_signatures]]
id = "legacy-usage"
kind = "whole-file"
targets = ["docs/usage.md"]
known_content_digests = [
  "sha256:3bf66fecb665eb9106df25e46718e3607d292d2c15d29790c04b409613eada62",
  "sha256:3cb47f0d614d85bdcced1270663838876b137aa12135091f9d9449b45c4f0af5",
  "sha256:e539c180e454db923e8b9361edb6c10cdcc835edfa9a9a805f93b12ff3633b6b",
]
consumer_owned_intent_pointer = "/cli_documentation/usage_ownership"

[[legacy_signatures]]
id = "legacy-workflow"
kind = "whole-file"
targets = [".github/workflows/cli-docs-check.yml"]
known_content_digests = ["sha256:3059b84e8730775e021b3e9ce14e819ef4bd0084fbd5ac996d811ede99e5baf8"]
