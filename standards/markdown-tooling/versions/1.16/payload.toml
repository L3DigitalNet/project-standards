[[legacy_states]]
id = "v4-markdown-tooling"

# Issues #209 and #211: 1.16 rewrites the documented local Prettier command inside
# both managed instruction blocks and advances the lint caller's action pin, so it
# is the first markdown-tooling successor since 1.14 that moves managed bytes. Every
# inbound route now crosses both changes; the 1.15 entry below is the new edge, and
# each older route gains the lint-caller contribution if it lacked one.
[[migrations]]
id = "markdown-tooling-1-15-to-1-16"
from = "package:1.15"
to = "package:1.16"
mode = "automatic"
provider = "migrate-legacy"
reversible = false
affected = [
  "contribution:agents-instructions",
  "contribution:claude-instructions",
  "contribution:lint-caller",
]

[[migrations]]
# Issue #88: the 1.13 successor bounds the documented local Prettier selection to
# the declared corpus, which is rendered into the two managed instruction blocks.
# Every route into 1.13 therefore crosses that block change, so each one below
# lists both instruction contributions.
id = "markdown-tooling-1-12-to-1-16"
from = "package:1.12"
to = "package:1.16"
mode = "automatic"
provider = "migrate-legacy"
reversible = false
affected = [
  "contribution:agents-instructions",
  "contribution:claude-instructions",
  "contribution:lint-caller",
]

[[migrations]]
# The 1.12 successor changed both managed workflow sources from mutable action
# tags to full commit SHAs. Every route older than 1.12 still crosses that exact
# render change, so each one below also lists both caller contributions.
id = "markdown-tooling-1-11-to-1-16"
from = "package:1.11"
to = "package:1.16"
mode = "automatic"
provider = "migrate-legacy"
reversible = false
affected = [
  "contribution:agents-instructions",
  "contribution:claude-instructions",
  "contribution:format-caller",
  "contribution:lint-caller",
]

