[[legacy_signatures]]
# 5.8.0 FR-005 / issue #27: the second digest is the observed literal-UTF-8-CJK
# serialization of the same JSON as the shipped (escaped) config. A consumer wrote
# it by hand before the adopt CLI existed; no release ever shipped it. Accepting it
# here lets either byte form migrate to managed ownership of the escaped bytes
# instead of hard-blocking on MT-LEGACY-MODIFIED. Append-only: the escaped digest
# (unchanged since v2.0.0) stays first.
#
# 5.12.0 issue #100: the third digest is the rule set THIS payload ships (it equals
# the markdownlint-source resource and markdownlint-config artifact digests above,
# which is the point). Since 1.9 the shipped config carries `"MD060": false`, so a
# V4 consumer who made that same deviation locally now holds bytes the planner
# already plans to `adopt` while the signature called them modified — the third
# repeat of #10/#27, and the reason this list must gain an entry whenever the
# shipped config changes. Only the digest history widens: the signature keeps its
# consumer_owned_intent_pointer and declares no unknown_content_disposition, the
# one combination the payload model forbids.
id = "legacy-markdownlint-config"
kind = "whole-file"
targets = [".markdownlint.json"]
known_content_digests = [
  "sha256:51204b5170e47da3716d3870d36ef1eb4b28a27d7289c65f7f1457943c499793",
  "sha256:4c1c089d0552a6118f6a8b7d85bae1bd762da41d601d1c489bdb9143f6a2d548",
  "sha256:c6a0217de8adbab6e24038f98577de8fa2f90062b873cc97b6bd2c09f89dba2b",
]
consumer_owned_intent_pointer = "/markdown_tooling/markdownlint_config_ownership"

[[legacy_signatures]]
