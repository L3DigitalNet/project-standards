[[legacy_states]]
id = "v4-markdown-tooling"

[[migrations]]
# Issue #88: the 1.13 successor bounds the documented local Prettier selection to
# the declared corpus, which is rendered into the two managed instruction blocks.
# Every route into 1.13 therefore crosses that block change, so each one below
# lists both instruction contributions.
id = "markdown-tooling-1-12-to-1-13"
from = "package:1.12"
to = "package:1.13"
mode = "automatic"
provider = "migrate-legacy"
reversible = false
affected = [
  "contribution:agents-instructions",
  "contribution:claude-instructions",
]

[[migrations]]
