[[legacy_states]]
id = "v4-markdown-tooling"

[[migrations]]
# 5.10.0 issue #63: the only 1.9->1.10 delta is the generated-directory lint
# scope, so this edge re-renders the lint caller and the two instruction blocks
# that publish that scope. The markdownlint rule set and the format caller are
# byte-identical across the two versions and are deliberately absent here.
id = "markdown-tooling-1-9-to-1-10"
from = "package:1.9"
to = "package:1.10"
mode = "automatic"
provider = "migrate-legacy"
reversible = false
affected = [
  "contribution:agents-instructions",
  "contribution:claude-instructions",
  "contribution:lint-caller",
]

[[migrations]]
# A package:1.8 consumer crosses both the 1.9 rule-set change and the 1.10 lint
# scope change on this edge, so it carries the union of their affected units.
id = "markdown-tooling-1-8-to-1-10"
from = "package:1.8"
to = "package:1.10"
mode = "automatic"
provider = "migrate-legacy"
reversible = false
affected = [
  "artifact:markdownlint-config",
  "contribution:agents-instructions",
  "contribution:claude-instructions",
  "contribution:format-caller",
  "contribution:lint-caller",
]

[[migrations]]
# 5.8.0 FR-005 / issue #27 widened the legacy-acceptance envelope for
# .markdownlint.json. A consumer on package:1.7 already holds the managed escaped
# bytes, so the direct successor edge re-verifies that artifact; the literal byte
# form arrives through the legacy path below.
id = "markdown-tooling-1-7-to-1-10"
from = "package:1.7"
to = "package:1.10"
mode = "automatic"
provider = "migrate-legacy"
reversible = false
affected = [
  "artifact:markdownlint-config",
]

[[migrations]]
id = "legacy-v4-to-1-10"
from = "legacy:v4-markdown-tooling"
to = "package:1.10"
mode = "automatic"
provider = "migrate-legacy"
reversible = false
affected = [
  "artifact:markdownlint-config",
  "artifact:prettier-config",
  "config:*",
  "contribution:agents-instructions",
  "contribution:claude-instructions",
