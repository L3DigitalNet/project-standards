input_schema = "provider-input"
output_schema = "provider-migration-report"
resources = ["legacy-workflow"]

[[legacy_states]]
id = "v4-project-spec"

# Package 1.9 changes only selected lint behavior and output metadata. It adds no
# configuration or artifact target, so ordinary reconciliation needs no
# package-to-package migration edge. The legacy route remains available for a
# repository entering the V5 control plane directly at this version.
[[migrations]]
id = "legacy-v4-to-1-9"
from = "legacy:v4-project-spec"
to = "package:1.9"
mode = "automatic"
provider = "migrate-legacy"
reversible = false
affected = ["config:*", "contribution:validate-specs-workflow"]
signatures = ["legacy-workflow"]

[[legacy_signatures]]
id = "legacy-workflow"
kind = "whole-file"
targets = [".github/workflows/validate-specs.yml"]
consumer_owned_intent_pointer = "/spec/workflow_ownership"
