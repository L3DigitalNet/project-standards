[[legacy_states]]
id = "v4-project-spec"

# Issue #132: 1.8 adds the optional `runner_labels` config key and emits it into the
# managed caller. The key is additive with an empty default, and the caller then omits
# the entry entirely, so a 1.7 consumer that sets nothing re-renders to identical
# bytes. Like 1.7 before it — which changed only the self-hosted workflow resource,
# adding `runner-labels` and the setup-uv 9.0.0 pin — nothing moves between artifact
# targets, so there is no package-to-package migration edge to declare: the workflow
# is a managed contribution, and ordinary reconciliation re-renders it on upgrade.
[[migrations]]
id = "legacy-v4-to-1-8"
from = "legacy:v4-project-spec"
to = "package:1.8"
mode = "automatic"
provider = "migrate-legacy"
reversible = false
affected = ["config:*", "contribution:validate-specs-workflow"]
signatures = ["legacy-workflow"]

[[legacy_signatures]]
id = "legacy-workflow"
kind = "whole-file"
targets = [".github/workflows/validate-specs.yml"]
consumer_owned_intent_pointer = "/spec/workflow_ownership"
