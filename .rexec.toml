# rexec repository configuration (.rexec.toml), committed with the repository.
#
# Schema-1 migration of this repository's full effective v0.1.3 configuration
# (rexec v0.2.0 cutover, 2026-08-10). Deliberate changes from v0.1.3 are
# recorded in the release evidence under remote-execution
# docs/evidence/rexec-v0.2/.

schema = 1

[remote]

# Effective v0.1.3 host: "rexec", set explicitly by the user-level [default] table
# and identical to the v0.1.3 compiled default. schema 1 has no default for it, so
# it must be declared here.
host = "rexec"

[sync]

# Read-only Git context on the worker (rexec v0.3.0): history, refs, HEAD, and
# the index are materialized from a sanitized allow-list, so the pytest lanes'
# ledger seed (`git log`) works remotely — the #167 / remote-execution#2
# limitation is resolved. Config, hooks, reflogs, and credentials never leave
# this machine, and `--pull` refuses `.git` regardless of this setting.
git_context = true

# Leg worktrees and orchestration state are workstation-only: mirroring them
# made rexec abort with "local source tree changed continuously" whenever a
# dispatched worker was editing in .claude/worktrees/ (2026-08-26).
exclude = [".claude/worktrees", ".workflow"]

[tools]

# Migrates the v0.1.3 [provision.tools.go] probe ("go version"), which declared
# no version. The exact version is derived from this repository's own source of
# truth, the go.mod toolchain directive, and is declared unqualified because go
# is one of the pinned mise release's core names.
go = "1.26.6"

[provision.debian]

# The full effective v0.1.3 Debian package list, in effective order: the
# user-level baseline followed by this repository's own additions, unioned exactly
# as the released Load did. schema 1 has no user layer, so the whole list is
# restated here to keep `rexec setup` converging exactly what it converged before.
packages = [
  "rsync",
  "git",
  "git-lfs",
  "make",
  "build-essential",
  "pkg-config",
  "cmake",
  "ninja-build",
  "curl",
  "ca-certificates",
  "jq",
  "sqlite3",
  "unzip",
  "zip",
  "xz-utils",
  "shellcheck",
  "shfmt",
  "ripgrep",
  "python3-dev",
  "python3-venv",
  "libffi-dev",
  "libssl-dev",
  "zlib1g-dev",
  "libbz2-dev",
  "liblzma-dev",
  "libsqlite3-dev",
  "libreadline-dev",
  "libyaml-dev",
  "libjpeg-dev",
  "libfreetype-dev",
  "libpng-dev",
  "libxml2-dev",
  "libxslt1-dev",
  "libpq-dev",
  "default-libmysqlclient-dev",
  "libopenblas-dev",
  "liblapack-dev",
  "gfortran",
]

# No [env] table, deliberately. Do not set UV_PROJECT_ENVIRONMENT here, despite
# other repositories using "{remote_cache}/python-env": `scripts/verify.sh`
# resolves its whole toolchain through the literal path `$REPO_ROOT/.venv/bin`
# — see that script's header on why it bypasses `uv run` — so redirecting the
# environment leaves `.venv` absent and the gate dies in preflight with
# "missing .venv/bin/ruff", which the advertised remedy (`uv sync --all-groups`)
# then cannot repair. The redirect also protects nothing: `.venv/` is a built-in
# rsync exclude and sync runs `--delete` without `--delete-excluded`, so a
# worktree-local remote `.venv` survives every synchronization; only
# `rexec clean` discards it, and re-running `uv sync` is far cheaper than an
# unusable gate.
